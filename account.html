<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account | Paws n' Play</title>
<link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/mgilbert1983/pawsnplay/main/WEBSITE_FAVICON.jpg">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pnp-app.css?v=3">
<style id="hero-style">
/* Home-page style banner (also in pnp-app.css; repeated here so it always shows) */
:root{--blue:#3414fd}
/* ---------- hero band: the same banner as the website's home page ---------- */
:root { --banner-base: #3f30f2; }
.hero {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: clamp(240px, 36vh, 380px);
  padding: 34px 20px 70px;
  text-align: center;
  background-color: var(--banner-base);
  background-image: none;
  border-radius: 0;
  overflow: hidden;
}
/* the picture sits on its own taller layer that glides at a different speed from the page (parallax) */
.hero-bg {
  position: absolute;
  inset: -24% 0;
  background: url("https://iili.io/Ke63t2I.png") center / cover no-repeat;
  will-change: transform;
  pointer-events: none;
}
.hero-inner { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; }
.hero::before, .hero::after { content: none; display: none; }
.hero .kicker { margin: 0 0 8px; font-size: 0.9rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #fff; }
.hero h1 { font-weight: 900; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.12; color: #fff; }
.hero h1.long { font-size: clamp(1.6rem, 4vw, 2.7rem); }
.hero .sub { margin: 12px auto 0; max-width: 60ch; font-size: 1.05rem; font-weight: 600; color: #fff; }
.hero .sub:empty { display: none; }
/* every line of banner text gets a 2px buffer in the banner's own purple for readability */
.hero .kicker, .hero h1, .hero .sub { text-shadow: 2px 0px 0 var(--banner-base), -2px 0px 0 var(--banner-base), 0px 2px 0 var(--banner-base), 0px -2px 0 var(--banner-base), 2px 1px 0 var(--banner-base), 2px -1px 0 var(--banner-base), -2px 1px 0 var(--banner-base), -2px -1px 0 var(--banner-base), 1px 2px 0 var(--banner-base), -1px 2px 0 var(--banner-base), 1px -2px 0 var(--banner-base), -1px -2px 0 var(--banner-base), 1px 1px 0 var(--banner-base), 1px -1px 0 var(--banner-base), -1px 1px 0 var(--banner-base), -1px -1px 0 var(--banner-base), 2px 2px 0 var(--banner-base), 2px -2px 0 var(--banner-base), -2px 2px 0 var(--banner-base), -2px -2px 0 var(--banner-base); }
@media (max-width: 700px) {
  .hero { padding: 26px 16px 62px; min-height: 220px; }
}
</style>

</head>
<body>
<header class="app-header">
  <a class="logo" href="index.html#top" aria-label="Paws n' Play, back to the website"><img src="https://iili.io/KkTOXcP.md.png" alt="Paws n' Play"></a>
  <nav class="app-nav" aria-label="Main"><a class="pill" href="index.html#top">Back to the website</a></nav>
</header>

<section class="hero">
  <div class="hero-bg" aria-hidden="true"></div>
  <div class="hero-inner">
  <h1>Login</h1>
  </div>
</section>

<main class="wrap narrow">
  <p id="cfg-warn" class="note hidden">Accounts are not switched on yet. Please call 778-737-7529.</p>

  <!-- Logged out -->
  <section id="out" class="card hidden" aria-live="polite">
    <div class="tabs" role="tablist">
      <button type="button" id="tab-in" class="alt" role="tab" aria-selected="true">Sign in</button>
      <button type="button" id="tab-up" class="alt" role="tab" aria-selected="false">Create account</button>
    </div>
    <form id="form" novalidate>
      <div id="name-row" class="hidden"><label for="name">Your name</label><input id="name" autocomplete="name" maxlength="120"></div>
      <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
      <div id="pw-row"><label for="pw">Password <span class="muted" id="pw-hint"></span></label><input id="pw" type="password" autocomplete="current-password" minlength="8"></div>
      <button id="go" type="submit" style="width:100%">Sign in</button>
      <button id="forgot" class="link" type="button">Forgot your password?</button>
    </form>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
  </section>

  <!-- Password reset (arrived from email link) -->
  <section id="reset" class="card hidden">
    <h3 style="margin-top:0">Choose a new password</h3>
    <form id="reset-form" novalidate>
      <label for="newpw">New password (8+ characters)</label>
      <input id="newpw" type="password" autocomplete="new-password" minlength="8">
      <button type="submit" style="width:100%">Save new password</button>
    </form>
    <p id="reset-msg" class="msg" role="status"></p>
  </section>

  <!-- Logged in -->
  <section id="in" class="card hidden">
    <p class="muted" style="margin-bottom:2px">Signed in as</p>
    <h3 style="margin:0 0 4px"><span id="who"></span></h3>
    <p id="role-line" class="muted"></p>
    <div style="display:grid;gap:10px;margin-top:10px">
      <a class="btn" style="margin:0" href="my-account.html">🐶 My dogs &amp; records</a>
      <a class="btn" style="margin:0" id="admin-link" href="admin.html">🗂️ Open the Staff Area</a>
    </div>
    <button id="signout" class="alt" type="button">Sign out</button>
  </section>
</main>

<footer class="app-footer">
  <p style="margin:0">Paws n' Play &middot; <a href="tel:+17787377529">778-737-7529</a> &middot; <a href="mailto:pawsnplayvancouver@gmail.com">pawsnplayvancouver@gmail.com</a></p>
</footer>

<script src="pnp-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var cfg = window.PNP_CONFIG || {};
  var configured = cfg.SUPABASE_URL && cfg.SUPABASE_URL.indexOf("PASTE_") !== 0 &&
                   cfg.SUPABASE_ANON_KEY && cfg.SUPABASE_ANON_KEY.indexOf("PASTE_") !== 0 &&
                   window.supabase && window.supabase.createClient;
  if (!configured) { $("cfg-warn").classList.remove("hidden"); return; }

  var sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  var mode = "in";            // "in" | "up" | "forgot"
  var recovering = false;
  var ROLE_TEXT = { customer: "Customer account", staff: "Staff account", admin: "Admin account", display: "Store display account" };

  function show(which) {
    ["out", "reset", "in"].forEach(function (k) { $(k).classList.toggle("hidden", k !== which); });
  }
  function setMode(m) {
    mode = m;
    $("name-row").classList.toggle("hidden", m !== "up");
    $("pw-row").classList.toggle("hidden", m === "forgot");
    $("forgot").classList.toggle("hidden", m !== "in");
    $("pw").autocomplete = m === "up" ? "new-password" : "current-password";
    $("pw-hint").textContent = m === "up" ? "(8+ characters)" : "";
    $("go").textContent = m === "up" ? "Create account" : m === "forgot" ? "Send reset link" : "Sign in";
    $("tab-in").setAttribute("aria-selected", String(m !== "up"));
    $("tab-up").setAttribute("aria-selected", String(m === "up"));
    $("msg").textContent = "";
  }
  $("tab-in").onclick = function () { setMode("in"); };
  $("tab-up").onclick = function () { setMode("up"); };
  $("forgot").onclick = function () { setMode("forgot"); };

  var here = location.origin + location.pathname;

  $("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var email = $("email").value.trim(), pw = $("pw").value, msg = $("msg"), go = $("go");
    msg.textContent = "";
    if (!/^\S+@\S+\.\S+$/.test(email)) { msg.textContent = "Please enter a valid email address."; return; }
    if (mode !== "forgot" && pw.length < 8) { msg.textContent = "Password must be at least 8 characters."; return; }
    go.disabled = true;
    try {
      var r;
      if (mode === "up") {
        r = await sb.auth.signUp({ email: email, password: pw, options: { emailRedirectTo: here, data: { full_name: $("name").value.trim().slice(0, 120) } } });
        if (r.error) throw r.error;
        msg.textContent = "Almost done. Check your email and click the confirmation link, then sign in.";
        setMode("in");
        $("msg").textContent = "Almost done. Check your email and click the confirmation link, then sign in.";
      } else if (mode === "forgot") {
        r = await sb.auth.resetPasswordForEmail(email, { redirectTo: here });
        if (r.error) throw r.error;
        msg.textContent = "If that email has an account, a reset link is on its way.";
      } else {
        r = await sb.auth.signInWithPassword({ email: email, password: pw });
        if (r.error) throw r.error;
      }
    } catch (err) {
      msg.textContent = (err && /confirm/i.test(err.message || "")) ? "Please confirm your email first (check your inbox)." :
                        (mode === "in") ? "Email or password not recognised." : "That did not work. Please try again or call 778-737-7529.";
    } finally { go.disabled = false; }
  });

  $("reset-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var pw = $("newpw").value, m = $("reset-msg");
    if (pw.length < 8) { m.textContent = "Password must be at least 8 characters."; return; }
    var r = await sb.auth.updateUser({ password: pw });
    if (r.error) { m.textContent = "Could not save the password. Please request a new link."; return; }
    recovering = false; m.textContent = "";
    render();
  });

  $("signout").onclick = async function () { await sb.auth.signOut(); };

  async function render() {
    if (recovering) { show("reset"); return; }
    var s = await sb.auth.getSession();
    var session = s.data && s.data.session;
    if (!session) { show("out"); setMode(mode === "forgot" ? "forgot" : mode); return; }
    $("who").textContent = session.user.email;
    var p = await sb.from("profiles").select("role").eq("id", session.user.id).maybeSingle();
    var role = p.data && p.data.role;
    $("role-line").textContent = ROLE_TEXT[role] || "";
    $("admin-link").classList.toggle("hidden", !(role === "staff" || role === "admin"));
    show("in");
  }

  sb.auth.onAuthStateChange(function (event) {
    if (event === "PASSWORD_RECOVERY") recovering = true;
    render();
  });
  setMode("in");
  render();
})();
</script>
<script>
/* Banner picture glides at its own speed while you scroll (same idea as the photo banners on the home page) */
(function () {
  var hero = document.querySelector('.hero'), bg = hero && hero.querySelector('.hero-bg');
  if (!bg) return;
  var mq = window.matchMedia('(prefers-reduced-motion: reduce)'), queued = false;
  function paint() {
    queued = false;
    if (mq.matches) { bg.style.transform = ''; return; }
    var max = hero.offsetHeight * 0.22;
    var y = Math.min(max, Math.max(0, window.pageYOffset * 0.35));
    bg.style.transform = 'translate3d(0,' + y.toFixed(1) + 'px,0)';
  }
  window.addEventListener('scroll', function () { if (!queued) { queued = true; requestAnimationFrame(paint); } }, { passive: true });
  window.addEventListener('resize', paint);
  paint();
})();
</script>
</body>
</html>
